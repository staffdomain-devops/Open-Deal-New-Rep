name: Campaign Pipeline

on:
  workflow_dispatch:
    inputs:
      list_id:
        description: "HubSpot list ID to process"
        required: true
        type: string
      pilot_mode:
        description: "Cap processing at 20 contacts"
        required: false
        type: boolean
        default: true

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      INPUT_LIST_ID: "${{ github.event.inputs.list_id }}"
      INPUT_USE_BATCH_API: "false"
      HUBSPOT_API_KEY: "${{ secrets.HUBSPOT_API_KEY }}"
      ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"
      TEAMS_WEBHOOK_URL: "${{ secrets.TEAMS_WEBHOOK_URL }}"
      PILOT_MODE: "${{ github.event.inputs.pilot_mode }}"
      PYTHONPATH: "${{ github.workspace }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: fetch-list
        working-directory: scripts
        run: python fetch_list.py

      - name: pilot-mode-cap
        working-directory: scripts
        run: python pilot_cap.py

      - name: fetch-records
        working-directory: scripts
        run: python fetch_record.py

      - name: exclude-and-route
        working-directory: scripts
        run: python exclude_and_route.py

      - name: generate-campaign
        working-directory: scripts
        run: python generate_campaign.py

      - name: lint
        working-directory: scripts
        run: python lint.py

      - name: assemble-bodies
        working-directory: scripts
        run: python assemble_bodies.py

      - name: assemble-output
        working-directory: scripts
        run: python assemble_output.py

      - name: write-hubspot
        working-directory: scripts
        run: python write_hubspot.py

      - name: upload-exclusion-report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exclusion-report
          path: "${{ runner.temp }}/exclusion_report.json"
          if-no-files-found: warn

      - name: upload-review-sample
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-sample
          path: "${{ runner.temp }}/review_sample.json"
          if-no-files-found: warn

      - name: upload-campaign-output
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: campaign-output
          path: "${{ runner.temp }}/campaign_output.json"
          retention-days: 7
          if-no-files-found: warn

      - name: upload-failed-contacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failed-contacts
          path: "${{ runner.temp }}/failed_contacts.json"
          if-no-files-found: warn

      - name: notify-teams
        if: failure()
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$TEAMS_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"Campaign pipeline FAILED. list_id=$INPUT_LIST_ID. Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\", \"list_id\": \"$INPUT_LIST_ID\", \"failed_step\": \"see run log\", \"run_url\": \"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
