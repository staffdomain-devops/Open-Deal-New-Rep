name: Contact Handover Pipeline

# Fired by a HubSpot workflow when a contact with an open deal gets a new
# owner. The HubSpot workflow's outbound webhook / custom-code action should
# POST to:
#   https://api.github.com/repos/<owner>/<repo>/dispatches
# with an "Authorization: Bearer <PAT>" header and body:
#   {"event_type": "contact-handover", "client_payload": {"contact_id": "<id>"}}
#
# The workflow_dispatch trigger below is for manual testing only (Actions tab
# > Contact Handover Pipeline > Run workflow) — it is not used by HubSpot.

on:
  repository_dispatch:
    types: [contact-handover]
  workflow_dispatch:
    inputs:
      contact_id:
        description: "HubSpot contact ID to run the pipeline for (manual testing)"
        required: true
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      INPUT_CONTACT_ID: "${{ github.event.client_payload.contact_id || github.event.inputs.contact_id }}"
      HUBSPOT_API_KEY: "${{ secrets.HUBSPOT_API_KEY }}"
      ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"
      TEAMS_WEBHOOK_URL: "${{ secrets.TEAMS_WEBHOOK_URL }}"
      PYTHONPATH: "${{ github.workspace }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: fetch-context
        working-directory: scripts
        run: python fetch_context.py "$INPUT_CONTACT_ID"

      - name: agent1-research
        id: research
        working-directory: scripts
        run: python agent1_research.py "$INPUT_CONTACT_ID"

      - name: agent2-build
        if: steps.research.outputs.verdict == 'PROCEED'
        working-directory: scripts
        run: python agent2_build.py "$INPUT_CONTACT_ID"

      - name: lint
        if: steps.research.outputs.verdict == 'PROCEED'
        working-directory: scripts
        run: python lint.py "$INPUT_CONTACT_ID"

      - name: assemble-bodies
        if: steps.research.outputs.verdict == 'PROCEED'
        working-directory: scripts
        run: python assemble_bodies.py "$INPUT_CONTACT_ID"

      - name: write-hubspot
        if: steps.research.outputs.verdict == 'PROCEED'
        working-directory: scripts
        run: python write_hubspot.py "$INPUT_CONTACT_ID"

      - name: upload-research-output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-output-${{ env.INPUT_CONTACT_ID }}
          path: "${{ runner.temp }}/research_*.json"
          if-no-files-found: warn

      - name: upload-generated-output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-output-${{ env.INPUT_CONTACT_ID }}
          path: |
            ${{ runner.temp }}/generated_*.json
            ${{ runner.temp }}/assembled_*.json
          if-no-files-found: warn

      - name: upload-failed-contact
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failed-contact-${{ env.INPUT_CONTACT_ID }}
          path: "${{ runner.temp }}/failed_contacts.json"
          if-no-files-found: warn

      - name: notify-teams
        if: failure()
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$TEAMS_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"Handover pipeline FAILED. contact_id=$INPUT_CONTACT_ID. Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\", \"contact_id\": \"$INPUT_CONTACT_ID\", \"failed_step\": \"see run log\", \"run_url\": \"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
